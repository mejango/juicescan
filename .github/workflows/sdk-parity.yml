name: sdk-parity

# Juicescan owns lean copies of nana-sdk-core logic, frozen by golden vectors: pay preparation at SDK
# 557a9fc (test/fixtures/sdk-557a9fc), the rest at 3.4.1 (test/fixtures/sdk-3.4.1).
# This replays those fixtures through the latest published SDK. A failure opens nothing: it is the
# signal for a human to decide whether juicescan follows the SDK. The SDK is never added to package.json.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the latest SDK without saving it
        run: npm i --no-save --ignore-scripts @bananapus/nana-sdk-core@latest
      - name: Replay the golden vectors through the latest SDK
        env:
          SDK_PARITY: '1'
        run: npx vitest run test/sdk-parity
